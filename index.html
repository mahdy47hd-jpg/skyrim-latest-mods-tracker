<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track the latest published Bethesda mods for Skyrim, Fallout and more.">
    <meta name="theme-color" content="#0f172a">
    <title>Skyrim Latest Bethesda Mods Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Skyrim Bethesda Mods Tracker</h1>
            <p>Discover the newest published mods from Bethesda.net</p>
            <p class="subtitle">Tracking Bethesda Official Mods API</p>
        </header>

        <div class="controls">
            <div class="filter-group">
                <label for="gameSelect">Game:</label>
                <select id="gameSelect">
                    <option value="skyrimse">Skyrim Special Edition</option>
                    <option value="skyrim">Skyrim (Legacy)</option>
                    <option value="fallout4">Fallout 4</option>
                    <option value="fallout76">Fallout 76</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="platformSelect">Platform:</label>
                <select id="platformSelect">
                    <option value="PC">PC (Windows)</option>
                    <option value="XBOX">Xbox One/Series</option>
                    <option value="PS4">PlayStation 4</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="refreshInterval">Auto-refresh:</label>
                <select id="refreshInterval">
                    <option value="0">Disabled</option>
                    <option value="30000">30 seconds</option>
                    <option value="60000" selected>1 minute</option>
                    <option value="300000">5 minutes</option>
                </select>
            </div>

            <button id="refreshBtn" class="btn-refresh">🔄 Refresh Now</button>
            <span id="lastUpdate" class="last-update">Loading...</span>
        </div>

        <div id="loadingSpinner" class="spinner" style="display:none;"></div>
        <div id="errorMessage" class="error-message" style="display:none;"></div>
        <div id="successMessage" class="success-message" style="display:none;"></div>
        
        <div class="mods-grid" id="modsGrid">
            <p class="loading-text">Loading Bethesda mods...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
