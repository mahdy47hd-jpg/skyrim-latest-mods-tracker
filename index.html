<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover the latest published mods for Skyrim and Fallout with real-time updates.">
    <meta name="theme-color" content="#0f172a">
    <title>Skyrim Latest Mods Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Skyrim Latest Mods Tracker</h1>
            <p>Discover the newest published mods for Skyrim and Fallout</p>
            <p class="subtitle">Data powered by Nexus Mods API</p>
        </header>

        <div class="controls">
            <div class="filter-group">
                <label for="gameSelect">Game:</label>
                <select id="gameSelect">
                    <option value="skyrimspecialedition">Skyrim Special Edition</option>
                    <option value="skyrim">Skyrim (Legacy)</option>
                    <option value="fallout4">Fallout 4</option>
                    <option value="fallout3">Fallout 3</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sortSelect">Sort By:</label>
                <select id="sortSelect">
                    <option value="updated">Recently Updated</option>
                    <option value="published">Recently Published</option>
                    <option value="trending">Trending</option>
                    <option value="downloaded">Most Downloaded</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="refreshInterval">Auto-refresh:</label>
                <select id="refreshInterval">
                    <option value="0">Disabled</option>
                    <option value="30000">30 seconds</option>
                    <option value="60000" selected>1 minute</option>
                    <option value="300000">5 minutes</option>
                </select>
            </div>

            <button id="refreshBtn" class="btn-refresh">🔄 Refresh Now</button>
            <span id="lastUpdate" class="last-update">Loading...</span>
        </div>

        <div id="loadingSpinner" class="spinner" style="display:none;"></div>
        <div id="errorMessage" class="error-message" style="display:none;"></div>
        <div id="successMessage" class="success-message" style="display:none;"></div>
        
        <div class="mods-grid" id="modsGrid">
            <p class="loading-text">Loading latest mods...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
